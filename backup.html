<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>海样归航 · 工作人员备用题卡</title><style>body{font:17px/1.6 sans-serif;margin:24px;color:#123d48}article{break-before:page}img{width:100%;max-width:1000px}li{margin-bottom:12px}.answers{background:#edf2ef;padding:18px}button{font:inherit;padding:12px}@media print{button{display:none}body{font-size:12pt}img{max-height:38vh;object-fit:contain}}</style><h1>海样归航 · 工作人员备用题卡</h1><p>含正确答案，供工作人员带队和设备故障时使用。巡检任选三处，再完成三个应急决策及一道复盘。请在开站前打印。</p><button onclick="print()">打印备用题卡</button><div id="cards"></div><script type="module">import {TASKS} from './data.js';document.querySelector('#cards').innerHTML=TASKS.map(t=>`<article><h2>${t.name}</h2><p>${t.intro}</p><img src="assets/${t.id}-inspect.webp" alt="巡检图"><ol>${t.hazards.map(q=>`<li><b>${q.title}</b>（横向 ${q.x}%，纵向 ${q.y}%）<br>${q.question}<br>正确整改：${q.options[0]}</li>`).join('')}</ol><h3>独立事故推演</h3><p>${t.incident}</p><img src="assets/${t.id}-incident.webp" alt="事故图"><ol>${t.emergencies.map(q=>`<li>${q.critical?'关键任务：':''}${q.title}<br>正确行动：${q.options[0]}<br>${q.feedback}</li>`).join('')}</ol><p class="answers">复盘：${t.recap.question}<br>${t.recap.options[0]}</p></article>`).join('');</script></html>
